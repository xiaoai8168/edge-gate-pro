name: Edge Gate Pro Node Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 6–12）'
        required: false
        default: '8'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '25'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate deployment secret
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          test -n "${DOMAIN}" || { echo "::error::缺少 Actions Secret: DOMAIN"; exit 1; }
          echo "检测端已配置。"

      - name: Run pipeline
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '8' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '25' }}
          MAX_CHECK_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          MIN_SUCCESS_RATIO: '0.30'
          MIN_PREVIOUS_RATIO: '0.35'
          REQUIRE_EXIT_IP: 'true'
          MAX_PER_EXIT_IP: '1'
          MAX_PER_ASN_PER_COUNTRY: '6'
          MAX_UNKNOWN_ASN_PER_COUNTRY: '2'
        run: python vpngate.py

      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "${api}")
          if [ "${status}" = "200" ]; then
            exit 0
          fi
          if [ "${status}" = "404" ]; then
            create=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' -X POST \
              "${auth[@]}" -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "${api}")
            case "${create}" in
              201|204|409) sleep 10; exit 0 ;;
              *)
                cat /tmp/pages-create.json 2>/dev/null || true
                echo "::error::无法自动启用 Pages（HTTP ${create}）"
                exit 1
                ;;
            esac
          fi
          cat /tmp/pages.json 2>/dev/null || true
          echo "::error::查询 Pages 状态失败（HTTP ${status}）"
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URLs
        run: |
          echo "仪表盘：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "订阅：  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
